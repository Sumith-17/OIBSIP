<!DOCTYPE html>
<html lang='en'>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>TO_DO_LIST</title>
        <link rel="stylesheet" href="index.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&family=Rammetto+One&display=swap" rel="stylesheet">

    </head>
    <body>

        <main class="main_card">

            <header class="title">
                <span class="title_badge">TASK MANAGER</span>
                <h1>My To-DO List</h1>
                <p>Keep your tasks organized and stay productive</p>
            </header>

            <div class="input_area">
                <input type="text" id="input" placeholder="Enter your task...." autocomplete="off">

                <button id="task_btn">Add Task</button>
            </div>
            
            <div class="lists" id="all_list">
                <section class="task_section">
                    <div class="section_header">
                        <div>
                            <h2>Pending Tasks</h2>
                            <p id="pending_count">Pending: 0</p>
                        </div>
                          <span class="section_dot pending_dot"></span>

                    </div>
                    <p class="pending_list" id="pending"></p>
                </section>
                <section class="task_section">
                    <div class="section_header">
                        <div>
                            <h2>Completed Tasks</h2>
                            <p id="completed_count">Completed: 0</p>
                        </div>
                        <span class="section_dot completed_dot"></span>

                    </div>
                    <p class="empty_message" id="completed_empty">
                        No completed tasks yet.
                    </p>
                    <div class="completed_list" id="completed"></div>
                </section>
            </div>
        </main>



        <script src="index.js"></script>
    </body>
</html>
