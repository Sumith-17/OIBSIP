<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login_card register_card">
            <div class="brand">
                <h3>AuthFlow</h3>
                <p>Create your account</p>
                 <span>Join us to get started</span>
            </div>
            
            <form  class="login_form" id="register-form" autocomplete="on">
                <div class="input_group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="new-username" placeholder="Choose a username" autocomplete="username" required>
                </div>

                <div class="input_group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
                </div>

                <div class="input_group">
                    <label for="password">Password</label>
                    <input placeholder="Create a password"  type="password" id="password" autocomplete="new-password" minlength="8"required>
                </div>

                <div class="input_group">
                    <label for="confirm-password">Confirm password</label>
                    <input type="password" id="confirm-password" placeholder="re-enter your password" autocomplete="new-password" minlength="8" required>
                </div>

                <button class="btn" type="submit">Create Account</button>

               
            </form>
             <p class="register_text">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>
        
    </main>
    <script src="register.js"></script>

</body>
</html>
