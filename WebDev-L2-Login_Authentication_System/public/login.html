<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
    
        <main class="login_card">
            <div class="brand">
                <h3>AuthFlow</h3>
                <p>Welcome Back!</p>
                 <span>Enter Details To Login</span>
            </div>
            
        
            <form class="login_form" id="login-form" autocomplete="on">
                    <div class="input_group">
                        <label for="username">Username or Email</label>
                        <input id="username" type="text" name="loginIndetifier"  placeholder="Enter username or email" autocomplete="username" required>
                    </div>
                    <div class="input_group">
                        <label for="password">Password</label>
                        <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>

                    <button class="btn" type="submit">Login</button>
            </form>

            <p class="register_text">Don't have an account? <a href="register.html">Create an account</a></p>
        </main>
    </body>
</html>
